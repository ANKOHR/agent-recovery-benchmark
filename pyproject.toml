[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-recovery-benchmark"
version = "0.1.0"
description = "Deterministic analysis of recorded execution-failure recovery trials"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arb2 = "agent_recovery_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["agent_recovery_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
